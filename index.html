<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background: linear-gradient(
                135deg,
                #4facfe,
                #00f2fe
            );

            transition: background 0.6s ease;
        }

        /* Background themes */

        body.clear {
            background: linear-gradient(
                135deg,
                #56ccf2,
                #2f80ed
            );
        }

        body.cloudy {
            background: linear-gradient(
                135deg,
                #757f9a,
                #d7dde8
            );
        }

        body.rain {
            background: linear-gradient(
                135deg,
                #314755,
                #26a0da
            );
        }

        body.storm {
            background: linear-gradient(
                135deg,
                #232526,
                #414345
            );
        }

        body.snow {
            background: linear-gradient(
                135deg,
                #83a4d4,
                #b6fbff
            );
        }

        .weather-app {
            width: 100%;
            max-width: 450px;

            padding: 30px;

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.20);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.25);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            color: white;
        }

        /* Header */

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.8;
            font-size: 14px;
        }

        /* Search */

        .search {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .search input {
            flex: 1;

            padding: 13px 15px;

            border: none;
            outline: none;

            border-radius: 12px;

            font-size: 15px;
        }

        .search button {
            border: none;
            padding: 0 16px;

            border-radius: 12px;

            cursor: pointer;

            background: white;
            color: #168eea;

            font-weight: bold;

            transition: 0.2s;
        }

        .search button:hover {
            transform: translateY(-2px);
            background: #f1f1f1;
        }

        /* Location button */

        .location-btn {
            width: 100%;

            border: none;

            padding: 11px;

            border-radius: 12px;

            background: rgba(255,255,255,0.18);

            color: white;

            cursor: pointer;

            font-weight: bold;

            margin-bottom: 25px;

            transition: 0.2s;
        }

        .location-btn:hover {
            background: rgba(255,255,255,0.28);
        }

        /* Main weather */

        .weather-main {
            text-align: center;
        }

        .weather-icon {
            font-size: 85px;

            margin: 5px 0 10px;

            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        .city {
            font-size: 25px;
            margin-bottom: 5px;
        }

        .date {
            opacity: 0.8;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .temperature {
            font-size: 65px;
            font-weight: bold;
            line-height: 1;
        }

        .description {
            font-size: 19px;
            margin-top: 12px;
        }

        .feels-like {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 6px;
        }

        /* Details */

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 10px;

            margin-top: 25px;
        }

        .detail {
            background: rgba(255,255,255,0.15);

            border-radius: 15px;

            padding: 15px 8px;

            text-align: center;
        }

        .detail-icon {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .detail-value {
            font-weight: bold;
            font-size: 15px;
        }

        .detail-label {
            display: block;

            font-size: 11px;

            opacity: 0.75;

            margin-top: 4px;
        }

        /* Forecast */

        .forecast-title {
            margin-top: 30px;
            margin-bottom: 12px;

            font-size: 18px;
        }

        .forecast {
            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 6px;
        }

        .forecast-day {
            background: rgba(255,255,255,0.12);

            border-radius: 14px;

            padding: 12px 5px;

            text-align: center;

            transition: 0.2s;
        }

        .forecast-day:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.20);
        }

        .forecast-date {
            font-size: 11px;
            opacity: 0.75;
            margin-bottom: 7px;
        }

        .forecast-icon {
            font-size: 24px;
            margin-bottom: 7px;
        }

        .forecast-temp {
            font-weight: bold;
            font-size: 13px;
        }

        /* Loading */

        .loading {
            text-align: center;
            padding: 30px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;

            margin: auto;
            margin-bottom: 12px;

            border: 4px solid rgba(255,255,255,0.3);

            border-top: 4px solid white;

            border-radius: 50%;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Error */

        .error {
            text-align: center;

            background: rgba(255, 80, 80, 0.25);

            border-radius: 10px;

            padding: 10px;

            margin-top: 15px;

            font-size: 14px;
        }

        /* Hidden */

        .hidden {
            display: none;
        }

        /* Responsive */

        @media (max-width: 500px) {

            .weather-app {
                padding: 22px;
            }

            .header h1 {
                font-size: 26px;
            }

            .temperature {
                font-size: 55px;
            }

            .weather-icon {
                font-size: 70px;
            }

            .forecast {
                gap: 4px;
            }

            .forecast-day {
                padding: 10px 3px;
            }
        }
    </style>
</head>

<body>

<div class="weather-app">

    <!-- HEADER -->

    <div class="header">
        <h1>🌤️ Weather App</h1>
        <p>Check the weather anywhere</p>
    </div>


    <!-- SEARCH -->

    <div class="search">

        <input
            type="text"
            id="cityInput"
            placeholder="Enter city..."
            value="Manila"
        >

        <button onclick="getWeather()">
            🔍
        </button>

    </div>


    <!-- CURRENT LOCATION -->

    <button class="location-btn" onclick="getCurrentLocation()">
        📍 Use My Location
    </button>


    <!-- LOADING -->

    <div id="loading" class="loading hidden">

        <div class="spinner"></div>

        <p>Getting weather...</p>

    </div>


    <!-- WEATHER -->

    <div id="weather">

        <div class="weather-main">

            <div
                class="weather-icon"
                id="weatherIcon"
            >
                🌤️
            </div>


            <h2
                class="city"
                id="city"
            >
                Manila, Philippines
            </h2>


            <div
                class="date"
                id="date"
            >
                Loading date...
            </div>


            <div
                class="temperature"
                id="temperature"
            >
                --°C
            </div>


            <div
                class="description"
                id="description"
            >
                Loading...
            </div>


            <div
                class="feels-like"
                id="feelsLike"
            >
                Feels like --°C
            </div>

        </div>


        <!-- DETAILS -->

        <div class="details">

            <div class="detail">

                <div class="detail-icon">
                    💧
                </div>

                <div
                    class="detail-value"
                    id="humidity"
                >
                    --%
                </div>

                <span class="detail-label">
                    Humidity
                </span>

            </div>


            <div class="detail">

                <div class="detail-icon">
                    💨
                </div>

                <div
                    class="detail-value"
                    id="wind"
                >
                    -- km/h
                </div>

                <span class="detail-label">
                    Wind
                </span>

            </div>


            <div class="detail">

                <div class="detail-icon">
                    🌡️
                </div>

                <div
                    class="detail-value"
                    id="pressure"
                >
                    -- hPa
                </div>

                <span class="detail-label">
                    Pressure
                </span>

            </div>

        </div>


        <!-- FORECAST -->

        <h3 class="forecast-title">
            5-Day Forecast
        </h3>


        <div
            class="forecast"
            id="forecast"
        >
        </div>

    </div>


    <!-- ERROR -->

    <p
        class="error hidden"
        id="error"
    ></p>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const cityInput = document.getElementById("cityInput");

const weatherContainer =
    document.getElementById("weather");

const loading =
    document.getElementById("loading");

const errorElement =
    document.getElementById("error");


/* =========================
   SEARCH WITH ENTER
========================= */

cityInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        getWeather();
    }

});


/* =========================
   GET WEATHER
========================= */

async function getWeather() {

    const city =
        cityInput.value.trim();

    if (!city) {

        showError("Please enter a city.");

        return;
    }


    try {

        showLoading();


        /* GET CITY COORDINATES */

        const geoResponse = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
        );


        if (!geoResponse.ok) {
            throw new Error("Geocoding failed");
        }


        const geoData =
            await geoResponse.json();


        if (
            !geoData.results ||
            geoData.results.length === 0
        ) {

            throw new Error("City not found");

        }


        const location =
            geoData.results[0];


        await loadWeather(
            location.latitude,
            location.longitude,
            location.name,
            location.country
        );


    } catch (error) {

        console.error(error);

        showError(
            "❌ City not found. Please try another city."
        );

    }

}


/* =========================
   LOAD WEATHER
========================= */

async function loadWeather(
    latitude,
    longitude,
    cityName,
    country
) {

    const weatherResponse = await fetch(

        `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,surface_pressure&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`

    );


    if (!weatherResponse.ok) {
        throw new Error("Weather API failed");
    }


    const weatherData =
        await weatherResponse.json();


    const current =
        weatherData.current;


    /* CITY */

    document.getElementById("city").textContent =
        `${cityName}, ${country}`;


    /* TEMPERATURE */

    document.getElementById("temperature").textContent =
        `${Math.round(current.temperature_2m)}°C`;


    /* FEELS LIKE */

    document.getElementById("feelsLike").textContent =
        `Feels like ${Math.round(current.apparent_temperature)}°C`;


    /* HUMIDITY */

    document.getElementById("humidity").textContent =
        `${current.relative_humidity_2m}%`;


    /* WIND */

    document.getElementById("wind").textContent =
        `${Math.round(current.wind_speed_10m)} km/h`;


    /* PRESSURE */

    document.getElementById("pressure").textContent =
        `${Math.round(current.surface_pressure)} hPa`;


    /* WEATHER */

    const weather =
        getWeatherDescription(
            current.weather_code
        );


    document.getElementById("description").textContent =
        weather.text;


    document.getElementById("weatherIcon").textContent =
        weather.icon;


    /* DATE */

    updateDate(
        weatherData.timezone
    );


    /* BACKGROUND */

    updateBackground(
        current.weather_code
    );


    /* FORECAST */

    createForecast(
        weatherData.daily
    );


    hideLoading();

}


/* =========================
   CURRENT LOCATION
========================= */

function getCurrentLocation() {

    if (!navigator.geolocation) {

        showError(
            "Geolocation is not supported by your browser."
        );

        return;
    }


    showLoading();


    navigator.geolocation.getCurrentPosition(

        async function(position) {

            try {

                const latitude =
                    position.coords.latitude;

                const longitude =
                    position.coords.longitude;


                /*
                    Reverse geocoding
                    to get city name
                */

                const response = await fetch(

                    `https://geocoding-api.open-meteo.com/v1/reverse?latitude=${latitude}&longitude=${longitude}&count=1&language=en&format=json`

                );


                const data =
                    await response.json();


                let cityName =
                    "Current Location";

                let country =
                    "";


                if (
                    data.results &&
                    data.results.length > 0
                ) {

                    cityName =
                        data.results[0].name;

                    country =
                        data.results[0].country;

                }


                await loadWeather(
                    latitude,
                    longitude,
                    cityName,
                    country
                );


            } catch (error) {

                console.error(error);

                showError(
                    "Unable to get your location weather."
                );

            }

        },


        function(error) {

            hideLoading();

            showError(
                "Location access was denied or unavailable."
            );

        }

    );

}


/* =========================
   WEATHER DESCRIPTION
========================= */

function getWeatherDescription(code) {

    if (code === 0) {

        return {
            text: "Clear Sky",
            icon: "☀️",
            type: "clear"
        };

    }


    if (code === 1) {

        return {
            text: "Mainly Clear",
            icon: "🌤️",
            type: "clear"
        };

    }


    if (code === 2) {

        return {
            text: "Partly Cloudy",
            icon: "⛅",
            type: "cloudy"
        };

    }


    if (code === 3) {

        return {
            text: "Overcast",
            icon: "☁️",
            type: "cloudy"
        };

    }


    if (code >= 45 && code <= 48) {

        return {
            text: "Foggy",
            icon: "🌫️",
            type: "cloudy"
        };

    }


    if (code >= 51 && code <= 57) {

        return {
            text: "Drizzle",
            icon: "🌦️",
            type: "rain"
        };

    }


    if (code >= 61 && code <= 67) {

        return {
            text: "Rain",
            icon: "🌧️",
            type: "rain"
        };

    }


    if (code >= 71 && code <= 77) {

        return {
            text: "Snow",
            icon: "❄️",
            type: "snow"
        };

    }


    if (code >= 80 && code <= 82) {

        return {
            text: "Rain Showers",
            icon: "🌦️",
            type: "rain"
        };

    }


    if (code >= 95) {

        return {
            text: "Thunderstorm",
            icon: "⛈️",
            type: "storm"
        };

    }


    return {
        text: "Unknown Weather",
        icon: "🌤️",
        type: "clear"
    };

}


/* =========================
   BACKGROUND
========================= */

function updateBackground(code) {

    const weather =
        getWeatherDescription(code);


    document.body.className =
        weather.type;

}


/* =========================
   DATE
========================= */

function updateDate(timezone) {

    const date =
        new Date();


    const formatted =
        new Intl.DateTimeFormat(
            "en-US",
            {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric",
                timeZone: timezone
            }
        ).format(date);


    document.getElementById("date").textContent =
        formatted;

}


/* =========================
   5-DAY FORECAST
========================= */

function createForecast(daily) {

    const forecast =
        document.getElementById("forecast");


    forecast.innerHTML = "";


    for (
        let i = 0;
        i < daily.time.length;
        i++
    ) {

        const date =
            new Date(
                daily.time[i] + "T00:00:00"
            );


        const day =
            date.toLocaleDateString(
                "en-US",
                {
                    weekday: "short"
                }
            );


        const weather =
            getWeatherDescription(
                daily.weather_code[i]
            );


        const max =
            Math.round(
                daily.temperature_2m_max[i]
            );


        const min =
            Math.round(
                daily.temperature_2m_min[i]
            );


        const card =
            document.createElement("div");


        card.className =
            "forecast-day";


        card.innerHTML = `

            <div class="forecast-date">
                ${day}
            </div>

            <div class="forecast-icon">
                ${weather.icon}
            </div>

            <div class="forecast-temp">
                ${max}° / ${min}°
            </div>

        `;


        forecast.appendChild(card);

    }

}


/* =========================
   LOADING
========================= */

function showLoading() {

    loading.classList.remove("hidden");

    weatherContainer.classList.add("hidden");

    errorElement.classList.add("hidden");

}


function hideLoading() {

    loading.classList.add("hidden");

    weatherContainer.classList.remove("hidden");

}


/* =========================
   ERROR
========================= */

function showError(message) {

    loading.classList.add("hidden");

    weatherContainer.classList.remove("hidden");

    errorElement.textContent =
        message;

    errorElement.classList.remove("hidden");

}


/* =========================
   INITIAL WEATHER
========================= */

getWeather();

</script>

</body>
</html>
